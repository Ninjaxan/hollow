<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Hollow</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

:root {
	--paper: #f2dec0;
	--muted: #c7ac89;
	--brass: #c5a26c;
	--wood: #211914;
	--rim: #806242;
}
[hidden] { display: none !important; }

.field-plate {
	position: relative;
	border: 1px solid var(--rim);
	background: var(--wood);
	color: var(--paper);
	box-shadow: 0 8px 26px #080609aa;
}
.field-plate::before {
	position: absolute;
	inset: 4px;
	border: 1px solid #594531;
	content: "";
	pointer-events: none;
}

#status {
	position: absolute;
	inset: 0;
	background: #090a11 url("hollow-loading.webp?v=3") center 12% / cover no-repeat;
	visibility: hidden;
}
#status-wordmark {
	position: absolute;
	top: 43%;
	left: 74%;
	transform: translate(-50%, -50%);
	width: min(455px, 41vw);
	height: auto;
}
#status-card, #status-notice {
	position: absolute;
	top: 62%;
	left: 74%;
	transform: translate(-50%, -50%);
	box-sizing: border-box;
	width: min(320px, 43vw);
	padding: 16px 18px;
}
.status-label {
	display: flex;
	flex-wrap: wrap;
	justify-content: space-between;
	align-items: baseline;
	gap: 6px 12px;
	margin-bottom: 9px;
}
#status-text { font: 20px/1.2 Georgia, serif; }
#status-percent { color: var(--muted); font: 600 13px system-ui, sans-serif; }
#status-progress, #opening-progress {
	display: block;
	width: 100%;
	height: 5px;
	appearance: none;
	border: 0;
	background: #423022;
	color: var(--brass);
}
progress::-webkit-progress-bar { background: #423022; }
progress::-webkit-progress-value { background: var(--brass); }
progress::-moz-progress-bar { background: var(--brass); }
#status-notice {
	overflow-wrap: anywhere;
	font: 15px/1.45 system-ui, sans-serif;
}

#hollow-opening {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	max-width: none;
	max-height: none;
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	background: #0b0909;
	color: var(--paper);
}
#hollow-opening[open] { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
#hollow-opening::backdrop { background: #0b0909; }
#hollow-opening video { width: 100%; height: 100%; object-fit: contain; }
#hollow-opening video::cue { color: #ffedd2; background: #16110fdf; }
.opening-controls {
	box-sizing: border-box;
	width: min(820px, calc(100% - 24px));
	margin: 0 auto max(12px, env(safe-area-inset-bottom));
	padding: 11px 14px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px 18px;
}
.opening-position { flex: 1; min-width: 0; }
.opening-position .status-label { margin-bottom: 6px; }
.opening-title { font: 19px/1.2 Georgia, serif; }
[data-time] { color: var(--muted); font: 12px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.opening-actions { display: flex; gap: 6px; }
#hollow-opening button {
	min-height: 44px;
	padding: 7px 11px;
	border: 1px solid #806242;
	background: #2d231b;
	color: inherit;
	font: 600 14px system-ui, sans-serif;
	white-space: nowrap;
	cursor: pointer;
}
#hollow-opening button:hover { background: #443326; }
#hollow-opening button:focus-visible { outline: 2px solid #f0ca8f; outline-offset: 2px; }
#hollow-opening button[aria-pressed="true"] { border-color: var(--brass); background: #56412b; }
#hollow-opening [data-skip] { background: #4e3926; }
#hollow-opening [data-play] {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}
@media (orientation: portrait) {
	#status { background: #05070b url("hollow-loading-tall.webp?v=3") top center / cover no-repeat; }
	#status-wordmark { top: auto; bottom: calc(8% + 92px); left: 50%; transform: translateX(-50%); width: min(380px, 80vw); }
	#status-card, #status-notice { top: auto; left: 50%; bottom: 8%; transform: translateX(-50%); width: min(320px, 88vw); }
}
@media (max-width: 520px) {
	.opening-controls { flex-wrap: wrap; }
	.opening-position { flex-basis: 100%; }
	.opening-actions { margin-left: auto; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="hollow-orchard-search.icon.png" />
<link rel="apple-touch-icon" href="hollow-orchard-search.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<dialog id="hollow-opening" aria-label="Hollow opening cinematic">
			<video playsinline preload="none" aria-label="Mara’s letter">
				<track kind="captions" src="hollow-opening-v1.vtt" srclang="en" label="English">
			</video>
			<button type="button" data-play hidden>Play intro</button>
			<div class="opening-controls field-plate">
				<div class="opening-position">
					<div class="status-label"><span class="opening-title">Mara’s letter</span><span data-time aria-hidden="true">0:00</span></div>
					<progress id="opening-progress" aria-label="Intro playback progress" max="1" value="0"></progress>
				</div>
				<div class="opening-actions">
					<button type="button" data-toggle hidden>Pause</button>
					<button type="button" data-captions aria-label="English captions" aria-pressed="false">CC</button>
					<button type="button" data-skip>Skip intro</button>
				</div>
			</div>
		</dialog>
		<script src="hollow-opening.js?v=controls"></script>



		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-wordmark" src="hollow-wordmark-splinter.webp" alt="Hollow">
			<div id="status-card" class="field-plate" hidden>
				<div class="status-label"><span id="status-text" role="status">Lighting the lantern…</span><span id="status-percent" aria-hidden="true"></span></div>
				<progress id="status-progress" aria-label="Loading Hollow"></progress>
			</div>
			<div id="status-notice" class="field-plate" role="alert" hidden></div>
		</div>

		<script>
// Android in-app browsers (the wallet, X, Facebook) call themselves "Version/4.0 Chrome/... Safari/...". Godot's
// loader takes that for Safari 4 and refuses to start. Say Chrome, as the phone's own browser does.
(function readAsChrome() {
	const name = navigator.userAgent.replace(/Version\/[\d.]+ (?=Chrome\/)/, '');
	if (name !== navigator.userAgent) Object.defineProperty(navigator, 'userAgent', { get: () => name });
}());
		</script>
		<script src="hollow-orchard-search.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"hollow-orchard-search","mainPack":"hollow-nell-seed-packet.pck","experimentalVK":true,"fileSizes":{"hollow-nell-seed-packet.pck":42958012,"hollow-orchard-search.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// Godot's web renderer compiles four lightmap-capable default programs per material up front. Hollow has no
// lightmaps, so every real draw uses a DISABLE_LIGHTMAP program; the defaults only froze the page (100 of 186).
(function skipUnusedShaders() {
	const gl = window.WebGL2RenderingContext && WebGL2RenderingContext.prototype;
	if (!gl) return;
	const compileSource = gl.shaderSource;
	gl.shaderSource = function (shader, source) {
		const head = source.slice(0, 1500);
		const unused = head.includes('#define BASE_PASS') && head.includes('#define USE_RADIANCE_MAP') &&
			head.includes('#define MAX_LIGHT_DATA_STRUCTS') && !head.includes('#define DISABLE_LIGHTMAP');
		return compileSource.call(this, shader, unused ? '#version 300 es\nprecision highp float;\nvoid main() {}\n' : source);
	};
}());
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusCard = document.getElementById('status-card');
	const statusPercent = document.getElementById('status-percent');
	const statusProgress = document.getElementById('status-progress');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusCard.hidden = mode !== 'progress';
		statusNotice.hidden = mode !== 'notice';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					// The wasm arrives compressed, so percent is honest where megabytes would not be.
					const label = current < total ? 'Loading Hollow…' : 'Opening the old house…';
					if (statusText.textContent !== label) statusText.textContent = label;
					statusPercent.textContent = Math.min(100, Math.floor(current / total * 100)) + '%';
				} else {
					statusPercent.textContent = '';
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
