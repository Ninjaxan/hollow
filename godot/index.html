<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Hollow</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: #090a11 url("hollow-loading.webp?v=2") center 12% / cover no-repeat;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress, #status-notice, #status-text {
	display: none;
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	bottom: 11%;
	width: min(420px, 70%);
	height: 6px;
	margin: 0 auto;
	border: 0;
	background: #2a211bcc;
}

#status-progress::-webkit-progress-bar { background: #2a211bcc; }
#status-progress::-webkit-progress-value { background: #d6af7a; }
#status-progress::-moz-progress-bar { background: #d6af7a; }

@media (orientation: portrait) {
	#status {
		background: #05070b url("hollow-loading-tall.webp?v=2") top center / cover no-repeat;
	}
}

#status-text {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(11% + 16px);
	color: #ebe0cb;
	font: 16px/1.4 Georgia, "Noto Serif", serif;
	text-align: center;
	text-shadow: 0 1px 6px #000;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#hollow-opening {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	max-width: none;
	max-height: none;
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	background: #000;
	color: #f2e4ce;
}
#hollow-opening::backdrop { background: #000; }
#hollow-opening video {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: contain;
}
#hollow-opening .opening-controls {
	position: absolute;
	display: flex;
	gap: 8px;
	right: max(16px, env(safe-area-inset-right));
	bottom: max(16px, env(safe-area-inset-bottom));
}
#hollow-opening button {
	min-height: 44px;
	padding: 8px 14px;
	border: 1px solid #846c52;
	border-radius: 4px;
	background: #17130f;
	color: inherit;
	font: 600 16px system-ui, sans-serif;
	cursor: pointer;
}
#hollow-opening button:focus-visible { outline: 2px solid #efbb82; outline-offset: 3px; }
#hollow-opening button[aria-pressed="true"] { background: #684929; }
#hollow-opening [data-play] {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}

		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="hollow-orchard-search.icon.png" />
<link rel="apple-touch-icon" href="hollow-orchard-search.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<dialog id="hollow-opening" aria-label="Hollow opening cinematic">
			<video playsinline preload="none" aria-label="Mara’s letter">
				<track kind="captions" src="hollow-opening-v1.vtt" srclang="en" label="English">
			</video>
			<button type="button" data-play hidden>Play intro</button>
			<div class="opening-controls">
				<button type="button" data-captions aria-label="English captions" aria-pressed="false">CC</button>
				<button type="button" data-skip>Skip intro</button>
			</div>
		</dialog>
		<script src="hollow-opening.js"></script>



		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false" src="hollow-loading.webp" alt="">
			<div id="status-text" role="status">Lighting the lantern…</div>
			<progress id="status-progress" aria-label="Loading Hollow"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Android in-app browsers (the wallet, X, Facebook) call themselves "Version/4.0 Chrome/... Safari/...". Godot's
// loader takes that for Safari 4 and refuses to start. Say Chrome, as the phone's own browser does.
(function readAsChrome() {
	const name = navigator.userAgent.replace(/Version\/[\d.]+ (?=Chrome\/)/, '');
	if (name !== navigator.userAgent) Object.defineProperty(navigator, 'userAgent', { get: () => name });
}());
		</script>
		<script src="hollow-orchard-search.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"hollow-orchard-search","mainPack":"hollow-doll-clue.pck","experimentalVK":true,"fileSizes":{"hollow-doll-clue.pck":42181080,"hollow-orchard-search.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// Godot's web renderer compiles four lightmap-capable default programs per material up front. Hollow has no
// lightmaps, so every real draw uses a DISABLE_LIGHTMAP program; the defaults only froze the page (100 of 186).
(function skipUnusedShaders() {
	const gl = window.WebGL2RenderingContext && WebGL2RenderingContext.prototype;
	if (!gl) return;
	const compileSource = gl.shaderSource;
	gl.shaderSource = function (shader, source) {
		const head = source.slice(0, 1500);
		const unused = head.includes('#define BASE_PASS') && head.includes('#define USE_RADIANCE_MAP') &&
			head.includes('#define MAX_LIGHT_DATA_STRUCTS') && !head.includes('#define DISABLE_LIGHTMAP');
		return compileSource.call(this, shader, unused ? '#version 300 es\nprecision highp float;\nvoid main() {}\n' : source);
	};
}());
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					// The wasm arrives compressed, so percent is honest where megabytes would not be.
					statusText.textContent = current < total ? 'Loading Hollow… ' + Math.floor(current / total * 100) + '%' : 'Opening the old house…';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
